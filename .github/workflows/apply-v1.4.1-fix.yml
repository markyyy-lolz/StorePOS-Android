name: Apply StorePOS v1.4.1 Insert Response Fix

on:
  push:
    branches:
      - "fix/v1.4.1-insert-response"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v1.4.1-insert-response
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 tools/apply_v141_hotfix.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/storepos/app/data/StoreRepository.kt app/build.gradle.kts RELEASE_NOTES.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "fix: request returned rows for Supabase inserts"
          git push origin HEAD:fix/v1.4.1-insert-response
