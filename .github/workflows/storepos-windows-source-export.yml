name: Package StorePOS Windows v1.0.3 Source

on:
  push:
    branches:
      - source-export/windows-v103
    paths:
      - .github/workflows/storepos-windows-source-export.yml

permissions:
  contents: write

jobs:
  windows-only-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact published Windows v1.0.3 source
        uses: actions/checkout@v4
        with:
          ref: 05aba70b69ed64f81678b6e8e793b102cbba6f9d
          persist-credentials: false
      - name: Package only the Windows source and its build workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-artifact
          git archive --format=zip --output=source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip HEAD -- windows/ .github/workflows/windows-build.yml
          unzip -Z1 source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip | tee source-artifact/manifest.txt
          if grep -Ev '^windows/|^\.github/$|^\.github/workflows/$|^\.github/workflows/windows-build\.yml
            echo "Unexpected non-Windows source file" >&2
            exit 1
          fi
          if unzip -Z1 source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip | grep -Ei '\.(exe|dll|pfx|jks|keystore|db|sqlite3)$'; then
            echo "Refusing to publish binary, credential or database files" >&2
            exit 1
          fi
          unzip -t source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip
          sha256sum source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip
      - name: Upload source ZIP with the official Windows developer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload windows-v1.0.3-preview.1 source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip --clobber
          gh release view windows-v1.0.3-preview.1 --json assets --jq '.assets[].name' | grep -Fx 'StorePOS-Windows-v1.0.3-SOURCE.zip'
 source-artifact/manifest.txt; then
            echo "Unexpected non-Windows source file" >&2
            exit 1
          fi
          if unzip -Z1 source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip | grep -Ei '\.(exe|dll|pfx|jks|keystore|db|sqlite3)$'; then
            echo "Refusing to publish binary, credential or database files" >&2
            exit 1
          fi
          unzip -t source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip
          sha256sum source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip
      - name: Upload source ZIP with the official Windows developer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload windows-v1.0.3-preview.1 source-artifact/StorePOS-Windows-v1.0.3-SOURCE.zip --clobber
          gh release view windows-v1.0.3-preview.1 --json assets --jq '.assets[].name' | grep -Fx 'StorePOS-Windows-v1.0.3-SOURCE.zip'
