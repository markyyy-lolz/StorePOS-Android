name: RestaurantPOS Android APK
on:
  push:
    branches: [restaurantpos-android-v0.1.0]
    paths:
      - 'restaurantpos-android/**'
      - '!restaurantpos-android/releases/**'
      - '.github/workflows/restaurantpos-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle -p restaurantpos-android :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=restaurantpos-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantPOS-Android-v0.1.0-APK
          path: restaurantpos-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restaurantpos-android/releases
          cp restaurantpos-android/app/build/outputs/apk/debug/app-debug.apk restaurantpos-android/releases/RestaurantPOS-v0.1.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restaurantpos-android/releases/RestaurantPOS-v0.1.0-debug.apk
          git commit -m 'build: RestaurantPOS Android v0.1.0 [skip ci]'
          git push origin HEAD:restaurantpos-android-v0.1.0
