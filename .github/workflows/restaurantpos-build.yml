name: RestaurantPOS Native Android APK
on:
  push:
    branches: [restaurantpos-native-v0.2.0]
    paths:
      - 'restaurantpos-android/**'
      - '!restaurantpos-android/releases/**'
      - '.github/workflows/restaurantpos-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable internal signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: restaurantpos-native-debug-keystore-v0.2
      - name: Create stable internal signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RestaurantPOS Internal,O=Azurate Software Solutions,C=PH"
          fi
      - name: Compile native APK
        run: gradle -p restaurantpos-android :app:assembleDebug --stacktrace
      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=restaurantpos-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: RestaurantPOS-Native-v0.2.0-APK
          path: restaurantpos-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restaurantpos-android/releases
          cp restaurantpos-android/app/build/outputs/apk/debug/app-debug.apk restaurantpos-android/releases/RestaurantPOS-v0.2.0-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restaurantpos-android/releases/RestaurantPOS-v0.2.0-debug.apk
          git commit -m 'build: RestaurantPOS Native Android v0.2.0 [skip ci]'
          git push origin HEAD:restaurantpos-native-v0.2.0
