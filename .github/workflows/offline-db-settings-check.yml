name: Offline Database Settings Validation

on:
  push:
    branches:
      - "fix/stable-offline-database-settings"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests, lint and APK build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
