name: Retire unsafe StorePOS v1.9.0-beta.1
on:
  push:
    branches:
      - "retire/unsafe-storepos-beta1"
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Remove outdated prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.9.0-beta.1 --cleanup-tag --yes
          echo "Outdated SQLite-v2 prerelease retired. Do not reinstall."
