name: Patch barcode auto-enter

on:
  push:
    branches:
      - fix/barcode-auto-enter
    paths:
      - .github/workflows/patch-barcode-auto-enter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/barcode-auto-enter
          fetch-depth: 0

      - name: Apply scanner patch
        run: python .github/scripts/patch_barcode_auto_enter.py

      - name: Remove patch helpers
        run: |
          rm .github/workflows/patch-barcode-auto-enter.yml
          rm .github/scripts/patch_barcode_auto_enter.py

      - name: Commit fix
        run: |
          git config user.name "StorePOS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-add barcode scans to POS cart"
          git push origin HEAD:fix/barcode-auto-enter
