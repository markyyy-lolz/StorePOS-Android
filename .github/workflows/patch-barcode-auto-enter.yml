name: Patch barcode auto-enter

on:
  push:
    branches: ["fix/barcode-auto-enter"]
    paths:
      - ".github/workflows/patch-barcode-auto-enter.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/barcode-auto-enter
          fetch-depth: 0

      - name: Patch POS scanner behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/storepos/app/ui/screens/PosPage.kt")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              text = text.replace(old, new, 1)

          # Raw hardware barcode scanners commonly act as HID keyboards and finish with Enter.
          replace_once(
              "import androidx.compose.ui.graphics.asImageBitmap\n",
              "import androidx.compose.ui.graphics.asImageBitmap\n"
              "import androidx.compose.ui.input.key.Key\n"
              "import androidx.compose.ui.input.key.KeyEventType\n"
              "import androidx.compose.ui.input.key.key\n"
              "import androidx.compose.ui.input.key.onPreviewKeyEvent\n"
              "import androidx.compose.ui.input.key.type\n",
              "scanner key imports"
          )

          old_launcher = '''    val barcodeLauncher = rememberLauncherForActivityResult(ScanContract()) { result ->
              val code = result.contents?.trim().orEmpty()
              if (code.isNotBlank()) {
                  val product = products.firstOrNull {
                      it.barcode.equals(code, ignoreCase = true) || it.sku.equals(code, ignoreCase = true)
                  }
                  if (product != null) {
                      if (product.isWeighed) quantityProduct = product
                      else cart = addLine(cart, product)
                      query = ""
                      error = null
                  } else {
                      query = code
                      error = "Barcode not found in inventory: " + code
                  }
              }
          }
          '''
          new_launcher = '''    fun submitScannedCode(rawCode: String) {
              val code = rawCode.trim()
              if (code.isBlank()) return
              val product = products.firstOrNull {
                  it.barcode.equals(code, ignoreCase = true) || it.sku.equals(code, ignoreCase = true)
              }
              if (product != null) {
                  if (product.isWeighed) quantityProduct = product
                  else cart = addLine(cart, product)
                  query = ""
                  error = null
              } else {
                  query = code
                  error = "Barcode / SKU not found in inventory: " + code
              }
          }

          val barcodeLauncher = rememberLauncherForActivityResult(ScanContract()) { result ->
              submitScannedCode(result.contents.orEmpty())
          }
          '''
          replace_once(old_launcher, new_launcher, "shared scanner submit handler")

          call_old_wide = '''                        {
                              if (it.isWeighed) quantityProduct = it
                              else cart = addLine(cart, it)
                          },
                          { scanBarcode() },
                          Modifier.weight(1.3f)
          '''
          call_new_wide = '''                        {
                              if (it.isWeighed) quantityProduct = it
                              else cart = addLine(cart, it)
                          },
                          { submitScannedCode(it) },
                          { scanBarcode() },
                          Modifier.weight(1.3f)
          '''
          replace_once(call_old_wide, call_new_wide, "wide ProductList scanner callback")

          call_old_compact = '''                        {
                              if (it.isWeighed) quantityProduct = it
                              else cart = addLine(cart, it)
                          },
                          { scanBarcode() },
                          Modifier.weight(1f)
          '''
          call_new_compact = '''                        {
                              if (it.isWeighed) quantityProduct = it
                              else cart = addLine(cart, it)
                          },
                          { submitScannedCode(it) },
                          { scanBarcode() },
                          Modifier.weight(1f)
          '''
          replace_once(call_old_compact, call_new_compact, "compact ProductList scanner callback")

          replace_once(
              '''    onQuery: (String) -> Unit,
              onAdd: (Product) -> Unit,
              onScan: () -> Unit,
              modifier: Modifier
          ) {
              Column(modifier, verticalArrangement = Arrangement.spacedBy(9.dp)) {
          ''',
              '''    onQuery: (String) -> Unit,
              onAdd: (Product) -> Unit,
              onSubmit: (String) -> Unit,
              onScan: () -> Unit,
              modifier: Modifier
          ) {
              LaunchedEffect(query, products) {
                  val candidate = query.trim()
                  if (candidate.length >= 6) {
                      delay(160)
                      val exactMatch = products.any {
                          it.barcode.equals(candidate, ignoreCase = true) ||
                              it.sku.equals(candidate, ignoreCase = true)
                      }
                      if (exactMatch) onSubmit(candidate)
                  }
              }

              Column(modifier, verticalArrangement = Arrangement.spacedBy(9.dp)) {
          ''',
              "ProductList scanner callback and idle exact-match auto-add"
          )

          old_field = '''        OutlinedTextField(
                      query,
                      onQuery,
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true,
                      placeholder = { Text("Search name, SKU, barcode or brand") },
                      leadingIcon = { Icon(Icons.Rounded.Search, null) },
                      trailingIcon = {
                          IconButton(onClick = onScan) {
                              Icon(Icons.Rounded.QrCodeScanner, contentDescription = "Scan barcode")
                          }
                      },
                      shape = RoundedCornerShape(16.dp)
                  )
          '''
          new_field = '''        OutlinedTextField(
                      value = query,
                      onValueChange = { rawValue ->
                          val hasScannerTerminator = rawValue.any { it == '\\n' || it == '\\r' }
                          val cleaned = rawValue.replace("\\n", "").replace("\\r", "")
                          onQuery(cleaned)
                          if (hasScannerTerminator && cleaned.isNotBlank()) onSubmit(cleaned)
                      },
                      modifier = Modifier
                          .fillMaxWidth()
                          .onPreviewKeyEvent { keyEvent ->
                              if (keyEvent.type == KeyEventType.KeyDown && keyEvent.key == Key.Enter) {
                                  val code = query.trim()
                                  if (code.isNotBlank()) onSubmit(code)
                                  true
                              } else {
                                  false
                              }
                          },
                      singleLine = true,
                      placeholder = { Text("Search name, SKU, barcode or brand") },
                      leadingIcon = { Icon(Icons.Rounded.Search, null) },
                      trailingIcon = {
                          IconButton(onClick = onScan) {
                              Icon(Icons.Rounded.QrCodeScanner, contentDescription = "Scan barcode")
                          }
                      },
                      shape = RoundedCornerShape(16.dp)
                  )
          '''
          replace_once(old_field, new_field, "barcode search field auto-submit")

          path.write_text(text)
          PY

      - name: Remove one-time patch workflow
        run: rm .github/workflows/patch-barcode-auto-enter.yml

      - name: Commit scanner fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "StorePOS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/storepos/app/ui/screens/PosPage.kt .github/workflows/patch-barcode-auto-enter.yml
          git commit -m "fix: auto-add barcode scans to POS cart"
          git push origin HEAD:fix/barcode-auto-enter
