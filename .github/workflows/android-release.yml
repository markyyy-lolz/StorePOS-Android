name: StorePOS GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release tag, e.g. v2.2.0"
        required: true
        type: string
  push:
    branches:
      - "publish/v*"

permissions:
  contents: write

concurrency:
  group: motopos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release name
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_NAME="${{ inputs.release_name }}"
          else
            RELEASE_NAME="${GITHUB_REF_NAME#publish/}"
          fi
          test -n "$RELEASE_NAME"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable StorePOS update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: storepos-debug-keystore-v1

      - name: Create stable StorePOS update signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=StorePOS Internal,O=StorePOS,C=PH"
          fi

      - name: Quality checks
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build update APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "StorePOS-${RELEASE_NAME}.apk"

      - name: Check signing certificate against installed v1.7.4 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A new debug key would make Android reject an over-the-top update
          # and could strand locally queued offline sales. Fail the release.
          gh release download v1.7.4 \
            --pattern 'StorePOS-v1.7.4.apk' \
            --dir "$RUNNER_TEMP"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          old_cert="$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/StorePOS-v1.7.4.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          new_cert="$("$APKSIGNER" verify --print-certs "StorePOS-${RELEASE_NAME}.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$old_cert" && test -n "$new_cert"
          if [[ "$old_cert" != "$new_cert" ]]; then
            echo "::error::Update signing certificate does not match v1.7.4. Do not distribute this APK."
            exit 1
          fi
          echo "StorePOS signing continuity verified."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorePOS-${{ env.RELEASE_NAME }}-apk
          path: StorePOS-${{ env.RELEASE_NAME }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            gh release upload "$RELEASE_NAME" "StorePOS-${RELEASE_NAME}.apk" --clobber
          else
            PRERELEASE_FLAGS=()
            if [[ "$RELEASE_NAME" == *-rc* || "$RELEASE_NAME" == *-beta* ]]; then
              PRERELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "$RELEASE_NAME" "${PRERELEASE_FLAGS[@]}" \
              "StorePOS-${RELEASE_NAME}.apk" \
              --target "$GITHUB_SHA" \
              --title "StorePOS $RELEASE_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
