name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable internal signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: storepos-debug-keystore-v1

      - name: Create stable internal signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=StorePOS Internal,O=StorePOS,C=PH"
          fi

      - name: Unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :launcher:testDebugUnitTest :launcher:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug :launcher:assembleDebug --stacktrace

      - name: Upload StorePOS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StorePOS-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload StorePOS Terminal Launcher debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StorePOS-Terminal-Launcher-debug
          path: launcher/build/outputs/apk/debug/launcher-debug.apk
