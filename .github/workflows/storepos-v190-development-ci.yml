name: StorePOS 1.9 development validation

on:
  push:
    branches:
      - "feature/storepos-v1.9.0-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests and lint (no release)
        run: gradle :app:testDebugUnitTest :app:lintDebug :launcher:testDebugUnitTest :launcher:lintDebug --stacktrace
      - name: Compile and package debug test APKs (not published)
        run: gradle :app:assembleDebug :launcher:assembleDebug --stacktrace
      - name: Preserve development APK for QA only
        uses: actions/upload-artifact@v4
        with:
          name: StorePOS-v190-development-unreleased
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
